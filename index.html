<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05080f">
  <title>Devign Iris</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%233de0ff' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%233de0ff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="app">
    <p id="boot" class="boot" role="status">Starting Iris…</p>
  </div>
  <noscript><p class="boot">Iris needs JavaScript enabled.</p></noscript>
  <script>
    // Boot guard: shows a readable message if the module bundle fails to start.
    (function () {
      function fail(msg) {
        var el = document.getElementById('boot');
        if (el) { el.textContent = msg; el.className = 'boot boot--error'; }
      }
      window.addEventListener('error', function (e) { fail('Iris failed to start: ' + (e.message || 'unknown error')); });
      setTimeout(function () {
        fail('Iris did not start. If index.html was opened directly as a file, serve it over HTTP instead (see README.md).');
      }, 3000);
    })();
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
